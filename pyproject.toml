[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zotero-pdf-harvester"
version = "0.1.0"
description = "Fast, resumable legal-OA PDF harvesting and Zotero attachment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyzotero>=1.6.0"]

[project.scripts]
zotero-pdf-harvester = "zotero_pdf_harvester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_pdf_harvester"]

[tool.pytest.ini_options]
pythonpath = ["src"]
